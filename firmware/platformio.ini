; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
lib_deps = arduino-libraries/MIDIUSB
monitor_speed = 115200
; Nombre con el que el dispositivo se anuncia por USB (puerto MIDI,
; monitor serie, lsusb...). Sustituye a "Arduino Leonardo". El
; fabricante no se puede cambiar: con el VID de Arduino, el core lo
; fuerza a "Arduino LLC" (USBCore.cpp).
board_build.usb_product = Roboguitarra
